<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGP vs EGP Simulation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .no-select { user-select: none; -webkit-user-select: none; }
        
        /* Custom scrollbar for tables */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Vertical text utility for collapsed sidebar */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen w-screen overflow-hidden m-0">

    <!-- Root takes full width/height for scalability in iframes -->
    <div id="root" class="absolute inset-0 flex flex-col bg-white"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons (UI Only) ---
        const IconRefresh = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"/><path d="M3 3v9h9"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 12"/><path d="M21 21v-9h-9"/></svg>;
        const IconServerUI = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>;
        const IconGlobe = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>;
        const IconClose = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const IconChevronLeft = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="15 18 9 12 15 6"></polyline></svg>;

        // --- SVG Paths for Internal Router Icons ---
        const ROUTER_ICON_PATH = (
            <g stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none">
                <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
                <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
                <line x1="6" y1="6" x2="6.01" y2="6"/>
                <line x1="6" y1="18" x2="6.01" y2="18"/>
            </g>
        );

        // --- Configuration ---
        const VIRTUAL_WIDTH = 1000;
        const VIRTUAL_HEIGHT = 500;

        const INITIAL_ROUTERS = [
            // AS 100 (Company A - Left)
            { id: 'R1', as: 100, name: 'R1 (Staff)', x: 100, y: 150, networks: ['192.168.10.0/24'], table: [] },
            { id: 'R2', as: 100, name: 'R2 (Servers)', x: 100, y: 350, networks: ['192.168.20.0/24'], table: [] },
            { id: 'R3', as: 100, name: 'R3 (Edge A)', x: 250, y: 250, networks: ['10.1.1.1/32'], table: [] }, 
            
            // The Internet (Middle)
            { id: 'R4', as: 0,   name: 'R4 (ISP)',   x: 450, y: 250, networks: ['8.8.8.8/32'], table: [] }, 

            // AS 200 (Company B - Right)
            { id: 'R5', as: 200, name: 'R5 (Edge B)', x: 650, y: 250, networks: ['10.2.2.1/32'], table: [] }, 
            { id: 'R6', as: 200, name: 'R6 (HQ)',     x: 800, y: 150, networks: ['172.16.10.0/24'], table: [] },
            { id: 'R7', as: 200, name: 'R7 (Branch)', x: 800, y: 350, networks: ['172.16.20.0/24'], table: [] },
        ];

        // Each IGP link now carries its own transit network (e.g. a point-to-point
        // interface subnet). This models the fact that a router ALWAYS knows the
        // networks on its own interfaces the moment a link comes up - it doesn't
        // need to wait for a routing protocol update to discover directly attached
        // links. EGP links deliberately have no pre-shared "network" here, since
        // exterior peers don't automatically know each other's networks the way
        // interior neighbors know their own local links.
        const LINKS = [
            { id: 'l1', src: 'R1', dst: 'R3', type: 'IGP', network: '10.0.13.0/30' },
            { id: 'l2', src: 'R2', dst: 'R3', type: 'IGP', network: '10.0.23.0/30' },
            { id: 'l3', src: 'R1', dst: 'R2', type: 'IGP', network: '10.0.12.0/30' },
            { id: 'l4', src: 'R6', dst: 'R5', type: 'IGP', network: '10.0.56.0/30' },
            { id: 'l5', src: 'R7', dst: 'R5', type: 'IGP', network: '10.0.57.0/30' },
            { id: 'l6', src: 'R6', dst: 'R7', type: 'IGP', network: '10.0.67.0/30' },
            { id: 'l7', src: 'R3', dst: 'R4', type: 'EGP' },
            { id: 'l8', src: 'R4', dst: 'R5', type: 'EGP' },
        ];

        // --- Main App Component ---

        function App() {
            const [routers, setRouters] = useState(INITIAL_ROUTERS);
            const [packets, setPackets] = useState([]);
            const [phase, setPhase] = useState('INIT');
            const [selectedRouterId, setSelectedRouterId] = useState(null); // Default to null for collapsed start
            const [animationActive, setAnimationActive] = useState(false);
            const animationRef = useRef();

            useEffect(() => {
                resetSim();
            }, []);

            const resetSim = () => {
                setPhase('INIT');
                setPackets([]);
                setAnimationActive(false);
                setSelectedRouterId(null);
                const freshRouters = INITIAL_ROUTERS.map(r => {
                    // 1. A router always knows its own locally attached network(s).
                    const ownRoutes = r.networks.map(net => ({
                        dest: net,
                        via: 'Direct',
                        proto: 'C',
                        metric: 0
                    }));

                    // 2. A router also always knows the transit network of every
                    // IGP link it directly participates in - this is learned the
                    // instant the interface/link comes up, before any routing
                    // update is ever sent. This is what lets a real router already
                    // "know all directly connected links" prior to running IGP.
                    const linkRoutes = LINKS
                        .filter(link => link.type === 'IGP' && link.network && (link.src === r.id || link.dst === r.id))
                        .map(link => {
                            const neighborId = link.src === r.id ? link.dst : link.src;
                            return {
                                dest: link.network,
                                via: `Link to ${neighborId}`,
                                proto: 'C',
                                metric: 0
                            };
                        });

                    return { ...r, table: [...ownRoutes, ...linkRoutes] };
                });
                setRouters(freshRouters);
            };

            useEffect(() => {
                if (packets.length === 0) return;
                let lastTime = performance.now();
                const animate = (time) => {
                    const delta = (time - lastTime) / 1000;
                    lastTime = time;
                    setPackets(prev => {
                        const next = prev.map(p => ({ ...p, progress: p.progress + delta * 0.8 })); 
                        const active = next.filter(p => {
                            if (p.progress >= 1) {
                                processPacketArrival(p);
                                return false; 
                            }
                            return true;
                        });
                        if (active.length === 0) setAnimationActive(false);
                        return active;
                    });
                    if (packets.length > 0) animationRef.current = requestAnimationFrame(animate);
                };
                animationRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(animationRef.current);
            }, [packets.length]);

            const runProtocol = (protocolMode) => {
                if (animationActive) return;
                setAnimationActive(true);
                setPhase(protocolMode);
                const newPackets = [];
                LINKS.forEach(link => {
                    const shouldRun = protocolMode === 'IGP' ? link.type === 'IGP' : true;
                    if (shouldRun) {
                        const rSrc = routers.find(r => r.id === link.src);
                        const rDst = routers.find(r => r.id === link.dst);
                        if (rSrc && rDst) {
                            newPackets.push(createPacket(rSrc, rDst, link.type));
                            newPackets.push(createPacket(rDst, rSrc, link.type));
                        }
                    }
                });
                setPackets(newPackets);
            };

            const createPacket = (src, dst, type) => ({
                id: Math.random().toString(36),
                srcId: src.id,
                dstId: dst.id,
                progress: 0,
                type: type,
                payload: src.table,
                color: type === 'IGP' ? '#3b82f6' : '#ef4444'
            });

            const processPacketArrival = (packet) => {
                setRouters(currentRouters => {
                    const dstRouter = currentRouters.find(r => r.id === packet.dstId);
                    const srcRouter = currentRouters.find(r => r.id === packet.srcId);
                    if (!dstRouter || !srcRouter) return currentRouters;
                    let updatedTable = [...dstRouter.table];
                    let changed = false;
                    packet.payload.forEach(route => {
                        const isNewDest = !updatedTable.find(r => r.dest === route.dest);
                        const existingRoute = updatedTable.find(r => r.dest === route.dest);
                        let newProto = packet.type === 'IGP' ? 'I' : 'B'; 
                        let newMetric = route.metric + 1;
                        if (dstRouter.networks.includes(route.dest)) return;
                        if (isNewDest) {
                            updatedTable.push({ dest: route.dest, via: srcRouter.id, proto: newProto, metric: newMetric });
                            changed = true;
                        } else if (existingRoute) {
                            if (existingRoute.proto === 'C') return;
                            if (newMetric < existingRoute.metric) {
                                existingRoute.via = srcRouter.id;
                                existingRoute.metric = newMetric;
                                existingRoute.proto = newProto;
                                changed = true;
                            }
                        }
                    });
                    if (changed) {
                        return currentRouters.map(r => r.id === dstRouter.id ? { ...r, table: updatedTable } : r);
                    }
                    return currentRouters;
                });
            };

            const getPos = (id) => {
                const r = routers.find(x => x.id === id);
                return r ? { x: r.x, y: r.y } : { x: 0, y: 0 };
            };

            const handleRouterClick = (e, routerId) => {
                e.stopPropagation(); // Prevent background click from deselecting
                setSelectedRouterId(routerId);
            };

            const handleBackgroundClick = () => {
                setSelectedRouterId(null);
            };

            const selectedRouter = routers.find(r => r.id === selectedRouterId);
            const isSidebarOpen = !!selectedRouterId;

            return (
                <div className="flex flex-col h-full w-full">
                    
                    {/* Header */}
                    <div className="bg-slate-900 text-white p-4 flex justify-between items-center shrink-0 z-20 shadow-md">
                        <div>
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <IconGlobe className="w-6 h-6 text-sky-400" />
                                IGP vs EGP Topology
                            </h1>
                            <p className="text-xs text-slate-400 mt-1 hidden sm:block">
                                Comparison of Interior (Internal) vs Exterior (External) routing protocols
                            </p>
                        </div>
                        
                        {/* Controls */}
                        <div className="flex gap-2 bg-slate-800 p-1 rounded-lg">
                             <button 
                                onClick={resetSim}
                                className="flex flex-col items-center justify-center w-14 h-12 bg-slate-700 hover:bg-slate-600 rounded text-xs transition-all border border-slate-600"
                            >
                                <IconRefresh className="w-4 h-4 mb-1 text-slate-300" />
                                <span className="font-semibold text-slate-300 text-[10px]">Reset</span>
                            </button>

                            <div className="w-px bg-slate-600 mx-1"></div>

                            <button 
                                onClick={() => runProtocol('IGP')}
                                disabled={phase !== 'INIT' && phase !== 'IGP'}
                                className={`flex flex-col items-center justify-center w-20 h-12 rounded text-xs transition-all border ${
                                    phase === 'INIT' || phase === 'IGP' 
                                    ? 'bg-blue-600 hover:bg-blue-500 border-blue-400 text-white shadow-lg shadow-blue-900/20' 
                                    : 'bg-slate-800 border-slate-700 text-slate-500 cursor-not-allowed opacity-50'
                                }`}
                            >
                                <div className="font-bold text-base mb-0.5">1</div>
                                <span className="font-semibold text-[10px]">Start IGP</span>
                            </button>

                            <button 
                                onClick={() => runProtocol('EGP')}
                                disabled={phase === 'INIT'} 
                                className={`flex flex-col items-center justify-center w-20 h-12 rounded text-xs transition-all border ${
                                    phase !== 'INIT'
                                    ? 'bg-red-600 hover:bg-red-500 border-red-400 text-white shadow-lg shadow-red-900/20' 
                                    : 'bg-slate-800 border-slate-700 text-slate-500 cursor-not-allowed opacity-50'
                                }`}
                            >
                                <div className="font-bold text-base mb-0.5">2</div>
                                <span className="font-semibold text-[10px]">Start EGP</span>
                            </button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex flex-1 min-h-0 relative">
                        
                        {/* Visualization Pane - Scalable SVG Container */}
                        <div 
                            className="flex-1 bg-slate-50 relative overflow-hidden flex items-center justify-center"
                            onClick={handleBackgroundClick}
                        >
                            {/* Empty State Instruction if no router selected */}
                            {!selectedRouterId && (
                                <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-white/80 px-4 py-2 rounded-full text-slate-500 text-xs shadow-sm pointer-events-none opacity-80 z-10">
                                    Click a router to view its table
                                </div>
                            )}

                            {/* The SVG acts as the entire scalable stage */}
                            <svg 
                                className="w-full h-full max-w-full max-h-full"
                                viewBox={`0 0 ${VIRTUAL_WIDTH} ${VIRTUAL_HEIGHT}`}
                                preserveAspectRatio="xMidYMid meet"
                            >
                                {/* Zone Backgrounds */}
                                <g className="opacity-80">
                                    <path d="M 50 100 Q 200 50 350 200 Q 200 400 50 350 Z" fill="#eff6ff" stroke="#bfdbfe" strokeWidth="2" strokeDasharray="5,5" />
                                    <text x="200" y="60" textAnchor="middle" className="fill-blue-500 font-bold text-sm tracking-widest opacity-60">AS 100 (IGP)</text>

                                    <path d="M 850 100 Q 700 50 550 200 Q 700 400 850 350 Z" fill="#f0fdf4" stroke="#bbf7d0" strokeWidth="2" strokeDasharray="5,5" />
                                    <text x="700" y="60" textAnchor="middle" className="fill-green-600 font-bold text-sm tracking-widest opacity-60">AS 200 (IGP)</text>

                                    <circle cx="450" cy="250" r="60" fill="#f8fafc" stroke="#e2e8f0" strokeWidth="2" />
                                    <text x="450" y="180" textAnchor="middle" className="fill-slate-400 font-bold text-xs">Internet (EGP)</text>
                                </g>

                                {/* Connections */}
                                {LINKS.map(link => {
                                    const s = getPos(link.src);
                                    const d = getPos(link.dst);
                                    const isEGP = link.type === 'EGP';
                                    const midX = (s.x + d.x) / 2;
                                    const midY = (s.y + d.y) / 2;

                                    return (
                                        <g key={link.id}>
                                            <line 
                                                x1={s.x} y1={s.y} x2={d.x} y2={d.y} 
                                                stroke={isEGP ? '#94a3b8' : '#cbd5e1'} 
                                                strokeWidth={isEGP ? 4 : 2} 
                                            />
                                            {isEGP && (
                                                <g>
                                                    <rect x={midX - 15} y={midY - 8} width="30" height="16" rx="4" fill="white" stroke="#cbd5e1" />
                                                    <text x={midX} y={midY + 3} textAnchor="middle" className="text-[10px] font-bold fill-slate-500" fontSize="10">BGP</text>
                                                </g>
                                            )}
                                        </g>
                                    );
                                })}

                                {/* Packets */}
                                {packets.map(p => {
                                    const s = getPos(p.srcId);
                                    const d = getPos(p.dstId);
                                    const cx = s.x + (d.x - s.x) * p.progress;
                                    const cy = s.y + (d.y - s.y) * p.progress;
                                    return (
                                        <circle key={p.id} cx={cx} cy={cy} r="6" fill={p.color} className="animate-pulse" />
                                    );
                                })}

                                {/* Routers (Now inside SVG for perfect scaling) */}
                                {routers.map(r => {
                                    const isSelected = selectedRouterId === r.id;
                                    // Logic for label positions
                                    const isTopLabel = r.id === 'R1' || r.id === 'R6';
                                    const nameY = isTopLabel ? -36 : 32;
                                    const netY = isTopLabel ? -48 : 44; // Stacked above or below

                                    const routerColor = r.as === 100 ? '#1d4ed8' : // blue-700
                                                        r.as === 200 ? '#15803d' : // green-700
                                                        '#334155'; // slate-700
                                    
                                    const routerBg = r.as === 100 ? '#eff6ff' : // blue-50
                                                     r.as === 200 ? '#f0fdf4' : // green-50
                                                     '#f1f5f9'; // slate-100

                                    const routerStroke = r.as === 100 ? '#3b82f6' : // blue-500
                                                         r.as === 200 ? '#22c55e' : // green-500
                                                         '#64748b'; // slate-500

                                    return (
                                        <g 
                                            key={r.id} 
                                            transform={`translate(${r.x}, ${r.y})`}
                                            onClick={(e) => handleRouterClick(e, r.id)}
                                            style={{ cursor: 'pointer' }}
                                        >
                                            {/* Router Circle */}
                                            <circle 
                                                r="24" 
                                                fill={routerBg} 
                                                stroke={routerStroke}
                                                strokeWidth={isSelected ? 4 : 2}
                                                className="transition-all duration-200"
                                            />
                                            
                                            {/* Router Icon (Centered) */}
                                            <g transform="translate(-12, -12)" className={r.as === 100 ? 'text-blue-700' : r.as === 200 ? 'text-green-700' : 'text-slate-700'}>
                                                {ROUTER_ICON_PATH}
                                            </g>

                                            {/* Name Label */}
                                            <rect 
                                                x="-35" y={nameY - 8} width="70" height="14" rx="3" 
                                                fill="rgba(255,255,255,0.85)" 
                                            />
                                            <text 
                                                y={nameY + 2} 
                                                textAnchor="middle" 
                                                className="font-bold fill-slate-700" 
                                                fontSize="10"
                                                style={{pointerEvents: 'none'}}
                                            >
                                                {r.name}
                                            </text>

                                            {/* Network Address Label */}
                                            <text 
                                                y={netY} 
                                                textAnchor="middle" 
                                                className="font-mono font-semibold fill-slate-500 opacity-90"
                                                fontSize="10"
                                                style={{textShadow: '0 0 4px white', pointerEvents: 'none'}}
                                            >
                                                {r.networks[0]}
                                            </text>
                                        </g>
                                    );
                                })}

                                {/* Legend (Inside SVG to stick to bottom center) */}
                                <g transform={`translate(${VIRTUAL_WIDTH/2}, ${VIRTUAL_HEIGHT - 30})`}>
                                    <rect x="-110" y="-12" width="220" height="24" rx="6" fill="white" stroke="#e2e8f0" fillOpacity="0.9" />
                                    <text x="-70" y="4" fontSize="10" fontWeight="bold" fill="#334155" textAnchor="end">Legend:</text>
                                    
                                    <circle cx="-55" cy="0" r="4" fill="#3b82f6" />
                                    <text x="-45" y="4" fontSize="10" fill="#334155" textAnchor="start">IGP (Internal)</text>

                                    <circle cx="35" cy="0" r="4" fill="#ef4444" />
                                    <text x="45" y="4" fontSize="10" fill="#334155" textAnchor="start">EGP (External)</text>
                                </g>

                            </svg>
                        </div>

                        {/* Sidebar - Collapsible Right Column */}
                        <div 
                            className={`
                                bg-white border-l border-slate-200 flex flex-col shadow-xl z-30 transition-all duration-300 ease-in-out shrink-0 overflow-hidden
                                ${isSidebarOpen ? 'w-80' : 'w-12 hover:bg-slate-50 cursor-pointer'}
                            `}
                            onClick={!isSidebarOpen ? () => setSelectedRouterId('R1') : undefined} // Click collapsed bar to open R1 default
                        >
                            {/* Content for OPEN State */}
                            {isSidebarOpen ? (
                                <>
                                    <div className="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-start shrink-0">
                                        <div className="flex-1">
                                            <h2 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                                <IconServerUI className="w-5 h-5 text-slate-500" />
                                                {selectedRouter ? selectedRouter.name : 'Select a Router'}
                                            </h2>
                                            <div className="text-xs text-slate-500 mt-1">
                                                AS Number: <span className="font-mono font-bold text-slate-700">{selectedRouter?.as || '0 (Transit)'}</span>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); setSelectedRouterId(null); }}
                                            className="text-slate-400 hover:text-slate-600 p-1 hover:bg-slate-200 rounded transition-colors"
                                        >
                                            <IconClose className="w-5 h-5" />
                                        </button>
                                    </div>

                                    <div className="flex-1 overflow-auto custom-scroll p-0 min-w-[20rem]">
                                        <table className="w-full text-left border-collapse text-xs">
                                            <thead className="bg-slate-100 text-slate-500 sticky top-0 font-semibold">
                                                <tr>
                                                    <th className="p-3 border-b">Proto</th>
                                                    <th className="p-3 border-b">Network</th>
                                                    <th className="p-3 border-b">Via</th>
                                                </tr>
                                            </thead>
                                            <tbody className="font-mono text-slate-700">
                                                {selectedRouter?.table.sort((a,b) => a.dest.localeCompare(b.dest)).map((route, i) => (
                                                    <tr key={i} className="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                                                        <td className="p-3">
                                                            <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${
                                                                route.proto === 'C' ? 'bg-slate-200 text-slate-600' :
                                                                route.proto === 'I' ? 'bg-blue-100 text-blue-600' :
                                                                'bg-red-100 text-red-600'
                                                            }`}>
                                                                {route.proto === 'C' ? 'CONN' : route.proto === 'I' ? 'IGP' : 'EGP'}
                                                            </span>
                                                        </td>
                                                        <td className="p-3">{route.dest}</td>
                                                        <td className="p-3 text-slate-500">{route.via}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                        {(selectedRouter?.table.length === 0 || !selectedRouter) && (
                                            <div className="p-8 text-center text-slate-400 italic text-xs">
                                                {selectedRouter ? 'Routing table is empty.' : 'Select a router to view table.'}
                                                <br/>
                                                {selectedRouter && 'Start a protocol to learn routes.'}
                                            </div>
                                        )}
                                    </div>

                                    <div className="p-3 bg-slate-50 border-t border-slate-200 text-[10px] text-slate-500 leading-relaxed shrink-0 min-w-[20rem]">
                                        <strong>Observation Hint:</strong>
                                        <ul className="list-disc ml-4 mt-1 space-y-1">
                                            <li>Even before you press Start, notice each router's table already lists <strong>CONN</strong> routes for its own network AND for every directly connected link (e.g. R1 already shows "Link to R2" and "Link to R3"). Real routers know their own interfaces instantly - no protocol update is needed for that.</li>
                                            <li>Click <strong>Step 1 (IGP)</strong>: Observe how R1 now learns about R2's and R3's own LAN networks (and any link networks it wasn't already directly attached to) - but still NOT about R6/R7.</li>
                                            <li>Click <strong>Step 2 (EGP)</strong>: Observe how packets cross the 'Internet' link. Now R1 can see routes to 172.16.x.x (AS 200).</li>
                                        </ul>
                                    </div>
                                </>
                            ) : (
                                /* Content for COLLAPSED State */
                                <div className="flex-1 flex flex-col items-center pt-6 pb-4 text-slate-400">
                                    <IconChevronLeft className="w-5 h-5 mb-4" />
                                    <div className="flex-1 flex items-center justify-center">
                                        <span className="vertical-text text-xs font-bold tracking-widest uppercase whitespace-nowrap">
                                            Routing Table
                                        </span>
                                    </div>
                                    <IconServerUI className="w-5 h-5 mt-4" />
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
